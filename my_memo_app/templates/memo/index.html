{% extends "base.html" %}

{% block title %}メモ一覧 - MyMemo{% endblock %}

{% block head %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="container-main">
  <h1>メモ一覧</h1>
  {% if not memos %}
    <p>メモは登録されていません。</p>
    <a class="btn btn-primary" href="{{ url_for('memo.create') }}">新しいメモを作成</a>
  {% else %}
    <table class="table table-striped">
      <thead>
        <tr><th>タイトル</th><th>操作</th></tr>
      </thead>
      <tbody>
        {% for memo in memos %}
        <tr>
          <td>{{ memo.title }}</td>
          <td>
            <a class="btn btn-sm btn-outline-primary" href="{{ url_for('memo.update', memo_id=memo.id) }}">編集</a>
            <a class="btn btn-sm btn-outline-danger" href="{{ url_for('memo.delete', memo_id=memo.id) }}">削除</a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <a class="btn btn-primary" href="{{ url_for('memo.create') }}">新しいメモを作成</a>
  {% endif %}
</div>
{% endblock %}
